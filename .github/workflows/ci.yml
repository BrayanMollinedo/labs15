
name: React CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout React
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

  tests:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout React
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false
        env:
          CI: true

  deploy:
    name: Deploy
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      vercel_url: ${{ steps.deploy-vercel.outputs.DEPLOY_URL }}

    steps:
      - name: Checkout React
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "DEPLOY_URL=$URL" >> "$GITHUB_OUTPUT"

  cypress-e2e:
    name: Cypress E2E Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cypress repository
        uses: actions/checkout@v4
        with:
          repository: Mollinedo-cmdo/cypress15
          path: cypress-project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress-project
          browser: chrome
          publish-summary: true
        env:
          CYPRESS_BASE_URL: ${{ needs.deploy.outputs.vercel_url }}
